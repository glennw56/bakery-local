<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drink board">
  <meta name="theme-color" content="#111318">
  <title>Drink board · Bakery Local</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="kds">
  <header class="kds-bar">
    <div class="kds-title">
      <a href="/">Admin</a>
      <h1>Drink board</h1>
      <span class="kds-window">Last {{ minutes }} min · grouped by order · tap when done · America/Chicago</span>
    </div>
    <form class="kds-tools" action="/board" method="get">
      <label>
        Window
        <input type="number" name="minutes" min="1" max="180" value="{{ minutes }}">
      </label>
      <button type="submit">Set</button>
      <button type="button"
              class="kds-demo"
              hx-post="/board/demo-tick?minutes={{ minutes }}"
              hx-target="#ticket-list"
              hx-swap="innerHTML">Demo drink</button>
    </form>
  </header>
  <section id="ticket-list"
           class="kds-list"
           hx-get="/board/tickets?minutes={{ minutes }}"
           hx-trigger="every 10s"
           hx-vals='js:{"cleared": (localStorage.getItem("kds_cleared") || sessionStorage.getItem("kds_cleared") || "")}'
           hx-swap="innerHTML">
    {% include "board/_tickets.html" %}
  </section>
  <script src="/static/board-cleared.js"></script>
  {% if ding_new %}
  <div id="kds-ding-gate" class="kds-ding-gate" role="dialog" aria-modal="true" tabindex="0">
    <p class="kds-ding-title">Tap to turn on the ding</p>
    <p class="kds-ding-copy">You will not hear new drinks until you do</p>
  </div>
  <script src="/static/board-ding.js"></script>
  {% endif %}
</body>
</html>
