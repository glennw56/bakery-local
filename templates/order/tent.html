<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print tent · Sunshine's drinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blush: #e8b4b8;
      --cocoa: #3f241c;
      --bg: #f7ecec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #ddd;
      color: var(--cocoa);
      font-family: "Source Sans 3", system-ui, sans-serif;
    }
    .wrap { padding: 1.5rem; display: grid; place-items: start center; gap: 1rem; }
    .hint { max-width: 22rem; font-size: 0.95rem; }
    .hint code { font-size: 0.85rem; word-break: break-all; }
    .tent {
      width: 5.5in;
      min-height: 8in;
      background: var(--bg);
      border: 3px solid var(--cocoa);
      border-radius: 6px;
      padding: 0.7in 0.55in 0.55in;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35in;
    }
    .logo { width: 1.55in; height: 1.55in; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.85rem;
      margin: 0;
      line-height: 1.15;
    }
    .qr {
      width: 2.6in;
      height: 2.6in;
      background: #fff;
      padding: 8px;
      border-radius: 8px;
    }
    .url { font-size: 0.92rem; margin: 0; letter-spacing: 0.01em; }
    .foot { margin: 0; font-size: 1.05rem; }
    @media print {
      body { background: #fff; }
      .no-print { display: none; }
      .wrap { padding: 0; }
      .tent { border-width: 2px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="hint no-print">Print this table tent for Irondale. QR opens <code>{{ order_url }}</code>. Cut and fold. Use any QR printer if this image does not load.</p>
    <article class="tent">
      <img class="logo" src="/static/order/logo.svg" alt="Sunshine's Bakery">
      <h1>Scan to order drinks</h1>
      <img class="qr"
           alt="QR code to order drinks"
           src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&amp;color=3f241c&amp;bgcolor=f7ecec&amp;data={{ order_url | urlencode }}">
      <p class="url">sunshinebakeshop.com</p>
      <p class="foot">Pay on your phone · no app</p>
    </article>
  </div>
</body>
</html>
