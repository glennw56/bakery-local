<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bakery Local{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a href="/" class="brand">Bakery Local</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/reports">Reports</a>
      <a href="/weekend">Weekend</a>
      <a href="/loyalty">Loyalty</a>
      <a href="/board">Drink board</a>
      <a href="/notes">Notes</a>
      {% if request.state.desk_authed and request.state.desk_gate %}
      <form class="nav-logout" method="post" action="/logout">
        <button type="submit">Log out</button>
      </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
